[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# manifold_gp lives at manifold/manifold_gp but is imported as the top-level
# `manifold_gp` (it is a vendored fork of upstream manifold-gp, so it keeps the
# upstream module name). manifold/ deliberately has no __init__.py, so listing
# it as a second discovery root maps manifold/manifold_gp -> manifold_gp.
[tool.setuptools.packages.find]
where = [".", "manifold"]
include = ["l3di*", "manifold_gp*", "other_experiments*"]

[project]
name = "l3di"
version = "0.1.0"
description = "A Python package for l3di."
authors = [
    { name="Your Name", email="your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "gpytorch",
    "numpy",
    "torch",
    "tqdm",
    "wandb"
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
] 